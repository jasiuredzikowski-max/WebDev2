<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
<title>Array Methods</title>
</head>
<body>
<h1>Array Methods</h1>
<p id = "list1"></p>
<p id = "list2"></p>
<p id = "list3"></p>
<p id = "list4"></p>
<script>
const numbers = [12, 5, 8, 130, 44, 2, 19];
document.querySelector('#list1').textContent =  `Array elements: ${numbers.join(", ")}`;

const isGreaterThan10 =(num) => num > 10;
let filteredNumbers = numbers.filter(isGreaterThan10);
document.querySelector('#list2').textContent =  `Numbers greater than 10: ${filteredNumbers.join(", ")}`;

const multiplyBy2 =(num) => num * 2;
let numbersMultipled = numbers.map(multiplyBy2);
document.querySelector('#list3').textContent =  `Numbers multiplied by 2: ${numbersMultipled.join(", ")}`;

const ascendingOrder = numbers.sort((a, b) => a - b);
document.querySelector('#list4').textContent =  `Numbers sorted in ascending order: ${ascendingOrder.join(", ")}`;
</script>
</body>
</html>
